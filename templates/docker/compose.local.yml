services:
  app:
    build:
      context: ../..
      dockerfile: templates/docker/Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
